[package]
name = "planetx_plugin"
version = "0.1.0"
edition = "2024"

[dependencies]
boardgames_server = { path = "../boardgames_server" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rand = "0.9"
itertools = "0.14"
tracing = "0.1"

[lib]
name = "planetx_plugin"
path = "src/lib.rs"
crate-type = ["rlib"]
