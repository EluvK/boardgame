name: Release bg_runtime Server

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-binary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build bg_runtime (release)
        run: cargo build -p bg_runtime --release

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$VERSION" == "" || "$VERSION" == "main" || "$VERSION" == "master" ]]; then
            VERSION="snapshot-${GITHUB_SHA::7}"
          fi
          PKG_NAME="bg_runtime-${VERSION}-linux-x86_64"
          mkdir -p dist
          cp target/release/bg_runtime "dist/bg_runtime"
          chmod +x dist/bg_runtime
          tar -C dist -czf "dist/${PKG_NAME}.tar.gz" bg_runtime
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: dist/${{ env.PKG_NAME }}.tar.gz

      - name: Upload release asset (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/${{ env.PKG_NAME }}.tar.gz
          asset_name: ${{ env.PKG_NAME }}.tar.gz
          tag: ${{ github.ref }}
          overwrite: true
