[package]
name = "acquire_plugin"
version = "0.1.0"
edition = "2024"

[dependencies]
boardgames_server = { path = "../boardgames_server" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

[lib]
name = "acquire_plugin"
path = "src/lib.rs"
crate-type = ["rlib"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
